name: notecraft_ai
description: Offline-first handwritten notes scanner with optional AI explanations.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.4
  google_mlkit_text_recognition: ^0.17.1
  image: ^4.12.0
  pdf: ^3.13.1
  path_provider: ^2.1.5
  share_plus: ^13.3.1
  http: ^1.5.0
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
